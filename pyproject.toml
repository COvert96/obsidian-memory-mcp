[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[project]
name = "obsidian-memory-mcp"
version = "0.1.0"
description = "MCP SDK-based server for guarded Obsidian memory access"
readme = "README.md"
license = "Apache-2.0"
authors = [
	{ name = "Obsidian Memory MCP contributors" },
]
maintainers = [
	{ name = "Obsidian Memory MCP contributors" },
]
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.17.1",
	"mcp>=1.27.1",
	"pyyaml>=6.0.3",
	"sqlalchemy>=2.0.50",
	"tiktoken>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/COvert96/obsidian-memory-mcp"
Repository = "https://github.com/COvert96/obsidian-memory-mcp"
Issues = "https://github.com/COvert96/obsidian-memory-mcp/issues"
Documentation = "https://github.com/COvert96/obsidian-memory-mcp/blob/main/README.md"
Changelog = "https://github.com/COvert96/obsidian-memory-mcp/blob/main/CHANGELOG.md"

[project.scripts]
mcp-memory = "obsidian_memory_mcp.cli:main"
obsidian-memory-tokens = "obsidian_memory_mcp.tokens:main"

[dependency-groups]
dev = [
	"anyio>=4.13.0",
	"import-linter>=2.11",
	"mypy>=2.1.0",
	"pytest>=8.4.0",
	"pytest-cov>=7.0.0",
	"radon>=6.0.1",
	"ruff>=0.15.14",
	"types-pyyaml>=6.0.12.20260518",
]

[tool.ruff.lint]
extend-select = [
	"PLC0415",
	"S101",
	"TID",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/obsidian_memory_mcp/database/__init__.py" = ["TID"]
"src/obsidian_memory_mcp/writes/__init__.py" = ["TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"obsidian_memory_mcp.database._tables" = { msg = "Import database tables via `obsidian_memory_mcp.database` (public API), not `database._tables`." }
"obsidian_memory_mcp.writes._service" = { msg = "Import write helpers via `obsidian_memory_mcp.writes` (public API), not `writes._service`." }

[tool.importlinter]
root_package = "obsidian_memory_mcp"

[[tool.importlinter.contracts]]
name = "Contracts and errors stay pure"
type = "forbidden"
source_modules = [
	"obsidian_memory_mcp.contracts",
	"obsidian_memory_mcp.errors",
]
forbidden_modules = [
	"obsidian_memory_mcp.database",
	"obsidian_memory_mcp.indexing",
	"obsidian_memory_mcp.retrieval",
	"obsidian_memory_mcp.writes",
	"obsidian_memory_mcp.context_packs",
	"obsidian_memory_mcp.server",
	"obsidian_memory_mcp.cli",
]

[[tool.importlinter.contracts]]
name = "Shared markdown syntax stays free of domain packages"
type = "forbidden"
source_modules = ["obsidian_memory_mcp.markdown"]
forbidden_modules = [
	"obsidian_memory_mcp.indexing",
	"obsidian_memory_mcp.database",
	"obsidian_memory_mcp.retrieval",
	"obsidian_memory_mcp.context_packs",
	"obsidian_memory_mcp.writes",
	"obsidian_memory_mcp.server",
	"obsidian_memory_mcp.cli",
]

[[tool.importlinter.contracts]]
name = "Indexing parser does not depend on IO adapters"
type = "forbidden"
source_modules = ["obsidian_memory_mcp.indexing.parser"]
forbidden_modules = [
	"obsidian_memory_mcp.database",
	"obsidian_memory_mcp.context_packs",
	"obsidian_memory_mcp.retrieval",
	"obsidian_memory_mcp.server",
	"obsidian_memory_mcp.cli",
]

[[tool.importlinter.contracts]]
name = "Retrieval stays independent of write and pack flows"
type = "forbidden"
source_modules = ["obsidian_memory_mcp.retrieval"]
forbidden_modules = [
	"obsidian_memory_mcp.writes",
	"obsidian_memory_mcp.context_packs",
	"obsidian_memory_mcp.indexing",
]

[[tool.importlinter.contracts]]
name = "Writes stay independent of retrieval and packs"
type = "forbidden"
source_modules = ["obsidian_memory_mcp.writes"]
forbidden_modules = [
	"obsidian_memory_mcp.retrieval",
	"obsidian_memory_mcp.context_packs",
]

[[tool.importlinter.contracts]]
name = "Database table definitions stay isolated"
type = "forbidden"
source_modules = [
	"obsidian_memory_mcp.database._tables",
	"obsidian_memory_mcp.database._engine",
]
forbidden_modules = [
	"obsidian_memory_mcp.indexing",
	"obsidian_memory_mcp.retrieval",
	"obsidian_memory_mcp.writes",
	"obsidian_memory_mcp.context_packs",
	"obsidian_memory_mcp.server",
	"obsidian_memory_mcp.cli",
]
