[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[project]
name = "obsidian-memory-mcp"
version = "0.1.0"
description = "Contract-first MCP server for guarded Obsidian memory access"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"jsonschema>=4.25.1",
	"pyyaml>=6.0.3",
	"tiktoken>=0.13.0",
]

[project.scripts]
mcp-memory = "obsidian_memory_mcp.cli:main"
obsidian-memory-tokens = "obsidian_memory_mcp.tokens:main"

[dependency-groups]
dev = [
	"pytest>=8.4.0",
]
