name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run ruff
        run: uv run ruff check

      - name: Run mypy
        run: uv run mypy --strict src

      - name: Run full test suite with coverage
        run: >
          uv run pytest
          --cov=obsidian_memory_mcp
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
          tests

      - name: Run release gate
        run: uv run pytest tests/release
