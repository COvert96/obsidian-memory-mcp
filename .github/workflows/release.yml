# Create a GitHub Release when a version tag is pushed (v*).
# Bump pyproject.toml and CHANGELOG.md before tagging; see docs/release-checklist.md.
name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml

  publish:
    name: Publish GitHub Release
    needs: quality-gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Verify tag matches pyproject.toml version
        run: uv run python scripts/verify_release_tag.py "${{ github.ref_name }}"

      - name: Extract changelog section for release notes
        run: uv run python scripts/extract_changelog.py "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: false
