# Example memory-mcp.yaml for an Obsidian vault.
#
# Place this file at the vault root:
#   {vault_root}/memory-mcp.yaml

vault_path: "path/to/example-vault"
index_db_location: "memory-index.sqlite3"

context_packs:
  - name: "api-docs"
    description: "Public API reference and usage examples"
    paths:
      - "wiki/api/**/*.md"
    token_budget: 6000

  - name: "architecture"
    description: "Architecture decisions and system overview"
    paths:
      - "docs/architecture/overview.md"
      - "docs/adr/**/*.md"
    sections:
      - "Decision"
      - "Context"
    token_budget: 8000

  - name: "compliance-bundle"
    description: "Compliance policy plus reusable API docs"
    paths:
      - "docs/compliance/policy.md"
    tags_filter:
      - "compliance"
    include_context_packs:
      - "api-docs"
    token_budget: 8000

  - name: "foundation"
    description: "Core repository orientation"
    paths:
      - "docs/tool-specifications.md"

write_constraints:
  read:
    allow:
      - "wiki/**"
      - "docs/**/*.md"
      - "README.md"
    deny:
      - "wiki/private/**"

  write:
    allow:
      - "wiki/proposals/"
    deny:
      - "wiki/log.md"

tags_separator: ","
max_proposal_ttl_hours: 24
proposal_ttl_seconds: 3600
max_proposal_content_bytes: 1048576
proposal_retention_days: 7
